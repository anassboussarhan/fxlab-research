name: gotobi-accuracy
# scripts/gotobi_accuracy_lab.py: more stops and targets, what goes with winning Gotobi nights, accuracy models.
# ci/GOTOBI_ACCURACY: MIRRORS EXTRA USDJPY (artifact run ids, as in ci/GOTOBI_RISK).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/GOTOBI_ACCURACY"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt yfinance requests
      - name: Bars of USD/JPY and EUR/JPY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read MIRRORS EXTRA USDJPY REST < ci/GOTOBI_ACCURACY
          mkdir -p dl
          for s in USDJPY EURJPY; do for M in $(echo "$MIRRORS" | tr ',' ' '); do gh run download $M -p "mm-$s-*" -D dl/mm_${M}_$s || true; done; done
          gh run download $USDJPY -p "m1-USDJPY-*" -D dl/uj
          gh run download $EXTRA -p "dk-EURJPY-*" -D dl/ej || true
          python ci/place_m1.py dl data/m1
          rm -rf dl
          ls data/m1
      - name: CFTC reports (JPY positioning feature; optional)
        run: python -W ignore scripts/cot_lab.py --fetch data/cot 2>&1 | tail -5 || true
      - run: set -o pipefail; python -W ignore scripts/gotobi_accuracy_lab.py --out out/acc --data-cot data/cot 2>&1 | tee out_lab.txt
      - name: Publish to the gotobi-accuracy branch (results and per-trade returns, no price data)
        if: always()
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p out && cp out_lab.txt out/ 2>/dev/null || true
          cp -r out /tmp/go
          git checkout --orphan ga-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p gotobi_accuracy && cp -r /tmp/go/* gotobi_accuracy/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > gotobi_accuracy/RUN.txt
          git add -f gotobi_accuracy
          git commit -qm "Gotobi accuracy lab (run ${{ github.run_id }})"
          git push -f origin HEAD:gotobi-accuracy
