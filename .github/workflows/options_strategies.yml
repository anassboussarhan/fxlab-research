name: options-strategies
# Options strategy lab: many structures x underlyings x management x filters on real end-of-day option quotes
# (DoltHub post-no-preference/options, free), cut at 2025-12-31, plus the calibrated synthetic layer for the long
# history and the capital-provider simulation of the best structures. Results to branch options-strategies.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/OPTIONS_STRATEGIES"]
permissions:
  contents: write
env:
  SYMBOLS: SPY,QQQ,IWM,DIA,GLD,SLV,TLT,EEM,XLE,USO,AAPL,MSFT,AMZN,NVDA,TSLA
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas scipy pyarrow yfinance
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Install dolt and clone the options database
        run: |
          curl -sSL https://github.com/dolthub/dolt/releases/latest/download/install.sh -o /tmp/install.sh
          sudo bash /tmp/install.sh
          dolt config --global --add user.email ci@example.com
          dolt config --global --add user.name ci
          mkdir -p /tmp/d && cd /tmp/d
          time dolt clone post-no-preference/options
          du -sh /tmp/d/options
      - name: Export the chains of the chosen underlyings (dates <= 2025-12-31)
        run: |
          mkdir -p raw chains
          cd /tmp/d/options
          dolt sql -q "DESCRIBE option_chain" -r csv | tee $GITHUB_WORKSPACE/chains/schema.csv
          for s in ${SYMBOLS//,/ }; do
            dolt sql -q "SELECT * FROM option_chain WHERE act_symbol='$s' AND date <= '2025-12-31'" -r csv > $GITHUB_WORKSPACE/raw/raw_$s.csv
            echo "$s $(wc -l < $GITHUB_WORKSPACE/raw/raw_$s.csv) rows"
          done
      - name: Normalise chains and fetch closes
        run: |
          python scripts/options_chain_fetch.py --raw raw --out chains
          python scripts/options_closes_fetch.py --symbols $SYMBOLS --out chains/closes.csv
      - uses: actions/upload-artifact@v4
        with:
          name: chains
          path: chains
          retention-days: 5
  lab:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas scipy pyarrow pytest
      - run: python -m pytest -q tests/test_options_strategy_lab.py
      - uses: actions/download-artifact@v4
        with:
          name: chains
          path: chains
      - name: Real-quote lab
        run: |
          mkdir -p out
          python scripts/options_strategy_lab.py --chain chains --closes chains/closes.csv --out out 2>&1 | tee out/log_lab.txt
      - name: Synthetic long-history layer (model)
        continue-on-error: true
        run: |
          mkdir -p out/synth
          python scripts/options_synth.py --chain chains --closes chains/closes.csv --real out/cycles.csv.gz --out out/synth 2>&1 | tee out/synth/log_synth.txt
      - name: Capital-provider simulation of the best structures
        continue-on-error: true
        run: python scripts/options_strategy_prop.py --daily out/daily_mtm_top30.csv --out out/prop_top30.csv 2>&1 | tee out/log_prop.txt
      - name: Publish to the options-strategies branch
        if: always()
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p /tmp/pub && cp -r out /tmp/pub/options_strategies
          cp chains/chain_meta.json chains/closes_meta.json chains/schema.csv /tmp/pub/options_strategies/ 2>/dev/null || true
          git checkout --orphan os-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          cp -r /tmp/pub/options_strategies .
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > options_strategies/RUN.txt
          git add -f options_strategies
          git commit -qm "Options strategy lab (run ${{ github.run_id }})"
          git push -f origin HEAD:options-strategies
