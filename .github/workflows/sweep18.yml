          pip install -q -r ci/requirements-ci.txt
          pip install -q torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu || pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: res-*
          path: in/
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-*
          path: audits/
          merge-multiple: true
      - name: Wait for the included runs to finish (at most 4.5 hours)
        if: needs.plan.outputs.include_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in ${{ needs.plan.outputs.include_runs }}; do
            for i in $(seq 1 270); do
              s=$(gh run view "$r" -R ${{ github.repository }} --json status -q .status 2>/dev/null || echo unknown)
              [ "$s" = "completed" ] && break
              echo "run $r: $s - waiting"; sleep 60
            done
          done
      - name: Fetch results of earlier runs (merged into one program-wide analysis)
        if: needs.plan.outputs.include_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in in_prev
          for r in ${{ needs.plan.outputs.include_runs }}; do
            gh run download "$r" -R ${{ github.repository }} -p 'res-*' -D "in_prev/$r" || echo "run $r: no artifacts"
            for d in in_prev/$r/res-*; do [ -d "$d" ] && mv "$d" "in/$(basename $d)__r$r"; done
          done
          ls in | wc -l
      - run: python ci/collect.py
      - name: Publish summaries to the results branch
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p /tmp/pub && cp -r sweep_results /tmp/pub/
          git checkout --orphan results-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          cp -r /tmp/pub/sweep_results .
          echo "run ${{ github.run_id }} mode ${{ needs.plan.outputs.mode }} $(date -u +%FT%TZ)" > sweep_results/RUN.txt
          git add -f sweep_results
          git commit -qm "Sweep results (run ${{ github.run_id }}, ${{ needs.plan.outputs.mode }})"
          git push -f origin HEAD:results18
