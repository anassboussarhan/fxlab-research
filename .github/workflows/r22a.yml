name: r22a
# Round 22 parts L and T (docs/round22_preregistration.md). Results on branch round22a. Trigger: ci/R22A.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R22A"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.s.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: echo "m=$(python -c "import json; d=json.load(open('ci/r22_syms.json')); print(json.dumps(d['store']+d['d2']+d['crypto']))")" >> $GITHUB_OUTPUT
  T:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: ${{ fromJSON(needs.list.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays requests
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/r22_place.sh ${{ matrix.symbol }}
      - run: python -W ignore scripts/r22_T.py --symbol ${{ matrix.symbol }} --out out
      - uses: actions/upload-artifact@v4
        with:
          name: r22T-${{ matrix.symbol }}
          path: out
          retention-days: 30
  L:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt
      - name: Library files (per configuration daily P&L)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lib
          for n in $(gh api "repos/${{ github.repository }}/actions/runs/42677782642/artifacts?per_page=100" -q '.artifacts[].name'); do
            case $n in s17-USA500IDXUSD|s17-USATECHIDXUSD|s17-JPNIDXJPY) continue;; esac
            gh run download 42677782642 -n $n -D tmp_$n && find tmp_$n -name "daily1*.npz" -exec mv {} lib/ \; ; rm -rf tmp_$n
          done
          for n in s17-USA500IDXUSD s17-USATECHIDXUSD s17-JPNIDXJPY; do
            gh run download 42690296819 -n $n -D tmp_$n && find tmp_$n -name "daily1*.npz" -exec mv {} lib/ \; ; rm -rf tmp_$n
          done
          for n in $(gh api "repos/${{ github.repository }}/actions/runs/42709504619/artifacts?per_page=100" -q '.artifacts[].name'); do
            gh run download 42709504619 -n $n -D tmp_$n && find tmp_$n -name "daily1*.npz" -exec mv {} lib/ \; ; rm -rf tmp_$n
          done
          for R in 43601331590 43601520485; do
            for n in $(gh api "repos/${{ github.repository }}/actions/runs/$R/artifacts?per_page=100" -q '.artifacts[].name' | grep '^r19-lib-'); do
              gh run download $R -n $n -D tmp_$n && find tmp_$n -name "daily1*.npz" -exec mv {} lib/ \; ; rm -rf tmp_$n
            done
          done
          ls lib | wc -l; ls lib | head -80 | tr '\n' ' '; du -sh lib
      - run: python -W ignore scripts/r22_L.py --files lib --out out 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22L
          path: out
          retention-days: 30
  publish:
    needs: [T, L]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r22*
          path: inp
      - run: |
          mkdir -p res
          python - <<'PY'
          import glob, pandas as pd
          T = [pd.read_csv(f) for f in glob.glob("inp/**/T_row_*.csv", recursive=True)]
          if T: pd.concat(T).to_csv("res/T_rows.csv", index=False)
          for f in glob.glob("inp/**/L_rows.csv", recursive=True): pd.read_csv(f).to_csv("res/L_rows.csv", index=False)
          PY
          ls res
      - name: Publish
        run: |
          cp -r res /tmp/pub
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          git checkout --orphan r22a-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p round22a && cp -r /tmp/pub/* round22a/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > round22a/RUN.txt
          git add -f round22a
          git commit -qm "round 22 L, T (run ${{ github.run_id }})"
          git push -f origin HEAD:round22a
