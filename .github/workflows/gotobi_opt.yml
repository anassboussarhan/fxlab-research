name: gotobi-opt
# scripts/gotobi_opt_lab.py (walk-forward Gotobi on seven yen pairs) then scripts/gotobi_opt_sims.py (own-account
# lottery and prop-firm simulations of the out-of-sample trades). ci/GOTOBI_OPT: MIRRORS EXTRA USDJPY FLOW FLOW2.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/GOTOBI_OPT"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt yfinance
      - name: Bars of the yen pairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read MIRRORS EXTRA USDJPY FLOW FLOW2 REST < ci/GOTOBI_OPT
          mkdir -p dl
          for s in USDJPY EURJPY; do for M in $(echo "$MIRRORS" | tr ',' ' '); do gh run download $M -p "mm-$s-*" -D dl/mm_${M}_$s || true; done; done
          gh run download $USDJPY -p "m1-USDJPY-*" -D dl/uj
          gh run download $EXTRA -p "dk-EURJPY-*" -D dl/ej || true
          gh run download $FLOW -p "fd-AUDJPY-*" -D dl/fa || true
          gh run download $FLOW -p "fd-GBPJPY-*" -D dl/fg || true
          gh run download $FLOW2 -p "fd2-*" -D dl/f2 || true
          python ci/place_m1.py dl data/m1
          rm -rf dl
          ls data/m1
      - run: python scripts/gotobi_opt_lab.py --out out/opt 2>&1 | tee out_lab.txt
      - run: python -W ignore scripts/gotobi_opt_sims.py --oos out/opt --out out/sims 2>&1 | tee out_sims.txt
      - name: Publish to the gotobi-opt branch (results and per-trade returns, no price data)
        if: always()
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p out && cp out_lab.txt out_sims.txt out/ 2>/dev/null || true
          cp -r out /tmp/go
          git checkout --orphan go-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p gotobi_opt && cp -r /tmp/go/* gotobi_opt/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ); bars from $(cat /dev/null)" > gotobi_opt/RUN.txt
          git add -f gotobi_opt
          git commit -qm "Gotobi walk-forward and simulations (run ${{ github.run_id }})"
          git push -f origin HEAD:gotobi-opt
