name: r25z
# Round 25 combine (scripts/r25_combine.py): artifacts r25P-*, r25AD-*, r25ALT-*, r25HAC-* of the runs listed in
# ci/R25Z ("RUNID note" lines), the altcoin universe of the r25data run; BH over all round-25 real counted streams;
# statistics to branch round25. Trigger: ci/R25Z.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R25Z"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p inp res
          for R in $(grep -E '^[0-9]{8,} ' ci/R25Z | cut -d' ' -f1); do
            bash ci/dl_each.sh $R '^r25(P|AD|ALT|HAC)-' inp/$R || { echo "artifact download incomplete for run $R"; exit 1; }
          done
          bash ci/dl_each.sh $(cat ci/r25_data_run.txt) '^r25alt-universe$' uni || echo "no altcoin universe"
          du -sh inp
      - shell: bash
        run: |
          U=$(ls uni/r25alt-universe/universe.json 2>/dev/null || true)
          python -W ignore scripts/r25_combine.py --inp inp --out res --universe "$U" 2>&1 | tee res/log.txt
          for f in $(find inp -name "P_meta_*.json" -o -name "AD_meta_*.json" -o -name "LW_meta_*.json"); do cp "$f" "res/$(basename $(dirname "$f"))_$(basename "$f")" 2>/dev/null || true; done
      - name: Publish
        run: |
          cp -r res /tmp/pub
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          git checkout --orphan r25z-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p round25 && cp -r /tmp/pub/* round25/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > round25/RUN.txt
          git add -f round25
          git commit -qm "round 25 combine (run ${{ github.run_id }})"
          git push -f origin HEAD:round25
