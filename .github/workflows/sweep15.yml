name: sweep15
# Round 15 (docs/round15_preregistration.md): every rule at D1 / W1 / MN with full grids and both directions,
# the book systems, every feature column, placebos (scripts/sweep15.py); combine with two tracks and BH
# (scripts/sweep15_combine.py). Trigger: ci/SWEEP15.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/SWEEP15"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  sym:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: [AUDCAD, AUDCHF, AUDJPY, AUDNZD, AUDUSD, CADCHF, CADJPY, CHFJPY, EURAUD, EURCAD, EURCHF, EURGBP, EURJPY, EURNZD, EURUSD, GBPAUD, GBPCAD, GBPCHF, GBPJPY, GBPNZD, GBPUSD, NZDCAD, NZDCHF, NZDJPY, NZDUSD, USDCAD, USDCHF, USDJPY, XAUUSD, XAGUSD, USA500IDXUSD, USATECHIDXUSD, JPNIDXJPY]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - name: Data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/fetch_m1.sh 41447353092 ${{ matrix.symbol }}
      - name: Sweep
        run: python -W ignore scripts/sweep15.py --symbol ${{ matrix.symbol }} --out out/s15 2>&1 | grep -v "^  " | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s15-${{ matrix.symbol }}
          path: out/s15
          retention-days: 60
  combine:
    needs: sym
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - uses: actions/download-artifact@v4
        with:
          pattern: s15-*
          path: s15_in
      - name: Combine
        run: mkdir -p out/sweep15 && python -W ignore scripts/sweep15_combine.py --inp s15_in --out out/sweep15 2>&1 | tee out/sweep15/combine_log.txt | tail -150 || true
      - name: Publish
        if: always()
        run: |
          for f in $(find s15_in -name 'log15_*.json'); do cp "$f" out/sweep15/; done
          cp -r out/sweep15 /tmp/pub
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          git checkout --orphan s15-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p sweep15 && cp -r /tmp/pub/* sweep15/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > sweep15/RUN.txt
          git add -f sweep15
          git commit -qm "sweep15 (run ${{ github.run_id }})"
          git push -f origin HEAD:sweep15
