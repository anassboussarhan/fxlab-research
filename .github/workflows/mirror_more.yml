name: mirror-more
# M1 bid/ask bars 2007-2018 of four more majors from the FX-Data GitHub mirror for scripts/ml_triple_barrier_lab.py.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/MIRROR_MORE"]
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pair: [GBPUSD, USDCAD, USDCHF, NZDUSD]
        years: ["2007 2008 2009 2010 2011 2012", "2013 2014 2015 2016 2017 2018"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q polars numpy pandas pyarrow
      - name: ${{ matrix.pair }} ${{ matrix.years }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m fxlab.data.acquire_fxdata_git --pairs ${{ matrix.pair }} --years ${{ matrix.years }} --scratch /tmp/fx
          mkdir -p part && cp data/m1/${{ matrix.pair }}/*.parquet part/ || true
          cp data/manifests/acquisition.jsonl part/manifest_${{ strategy.job-index }}.jsonl || true
          ls -la part
          python - <<'PY'
          import json
          for l in open("part/manifest_${{ strategy.job-index }}.jsonl"):
              r = json.loads(l)
              print(f"::notice title=mirror {r.get('pair')} {r.get('year')}::{r.get('status')} {r.get('n_minutes')} minutes {r.get('first_ts')} .. {r.get('last_ts')} {str(r.get('error', ''))[:200]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mm-${{ matrix.pair }}-${{ strategy.job-index }}
          path: part
          retention-days: 30
