name: probe-options-data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/PROBE_OPTIONS", "ci/probe_options.py", "ci/PROBE_OPTIONS2"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone the options database and take its inventory
        run: |
          mkdir -p probe_results/options2
          curl -sSL https://github.com/dolthub/dolt/releases/latest/download/install.sh -o /tmp/install.sh
          sudo bash /tmp/install.sh
          dolt config --global --add user.email probe@example.com
          dolt config --global --add user.name probe
          mkdir -p /tmp/d && cd /tmp/d && time dolt clone post-no-preference/options > /tmp/clone.log 2>&1; tail -2 /tmp/clone.log
          cd $GITHUB_WORKSPACE && bash ci/probe_options2.sh 2>&1 | tee probe_options.log
      - name: Publish to the probe-options branch
        if: always()
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p /tmp/pub && cp -r probe_results /tmp/pub/ && cp probe_options.log /tmp/pub/probe_results/options2/ || true
          git checkout --orphan probe-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          cp -r /tmp/pub/probe_results .
          git add -f probe_results
          git commit -qm "Options data probe (run ${{ github.run_id }})"
          git push -f origin HEAD:probe-options2
