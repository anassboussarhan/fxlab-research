name: duka-extra
# Small resumable Dukascopy downloads (per year, a deadline inside the job, partial results uploaded) for the
# EURJPY Gotobi window of the overnight rule: 14:00-23:59 UTC on the day before each non-Monday Gotobi day and
# 00:00-01:59 UTC on the day itself, 2019-2025. Development data only: ends 2025-12-31.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/DUKA_EXTRA"]
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q polars numpy pandas pyarrow holidays
      - name: EURJPY Gotobi window ${{ matrix.year }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          Y=${{ matrix.year }}
          python ci/intraday_dates.py gotobi_prev $Y > prev.txt
          python ci/intraday_dates.py gotobi $Y > day.txt
          wc -l prev.txt day.txt
          S=$((Y-1))-12-25T00:00:00; E=$((Y+1))-01-01T00:00:00
          python -m fxlab.data.acquire_dukascopy --pairs EURJPY --start $S --end $E --hours 14-23 --dates-file prev.txt --suffix _xp$Y --workers 4 --deadline-min 150 || true
          python -m fxlab.data.acquire_dukascopy --pairs EURJPY --start $S --end $E --hours 0-1 --dates-file day.txt --suffix _xd$Y --workers 4 --deadline-min 140 || true
          mkdir -p part && cp data/m1/EURJPY/*.parquet part/ || true
          cp data/manifests/acquisition.jsonl part/manifest_x$Y.jsonl || true
          ls -la part
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dk-EURJPY-x${{ matrix.year }}
          path: part
          retention-days: 30
          if-no-files-found: warn
