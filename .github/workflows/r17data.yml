name: r17data
# Round 17 data (docs/round17_preregistration.md; scripts/r17_data.py). ci/R17DATA: "<sweep17 run id> ...".
# Data stays in the r17data artifact; the coverage report goes to branch round17-data. Trigger: ci/R17DATA.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R17DATA"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - name: Libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ci/R17DATA: sweep17 run ids (the words that are numbers), later runs replacing earlier ones' artifacts
          for R in $(tr ' ' '\n' < ci/R17DATA | grep -E '^[0-9]+$'); do
            for n in $(gh api "repos/${{ github.repository }}/actions/runs/$R/artifacts?per_page=100" -q '.artifacts[].name' | grep '^s17-'); do
              rm -rf s17_in/$n; gh run download $R -n $n -D s17_in/$n || true
            done
          done
          du -sh s17_in; ls s17_in | wc -l
      - run: python -W ignore scripts/r17_data.py book --inp s17_in --out out/book 2>&1 | tail -45
      - uses: actions/upload-artifact@v4
        with:
          name: r17-book
          path: out/book
          retention-days: 30
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - uses: actions/download-artifact@v4
        with:
          pattern: d1p-*
          path: d1p_in
          run-id: 42534301711
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -W ignore scripts/r17_data.py fx --inp d1p_in --out out/fx 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: r17-fx
          path: out/fx
          retention-days: 30
  cme:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays databento==0.90.0
      - name: Databento artifacts (round 9)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41846466839 -n databento-data -D dbn
          gh run download 41854224685 -n databento-compact -D compact
      - run: python -W ignore scripts/r17_data.py cme --dbn dbn --compact compact --out out/cme 2>&1 | tail -10
      - uses: actions/upload-artifact@v4
        with:
          name: r17-cme
          path: out/cme
          retention-days: 30
  merge:
    needs: [book, fx, cme]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - uses: actions/download-artifact@v4
        with:
          pattern: r17-*
          path: r17_in
      - name: Web series of round 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42669526702 -n r16-web -D web
      - run: |
          mkdir -p out/r17data
          python -W ignore scripts/r17_data.py merge --inp r17_in --web web --out out/r17data 2>&1 | tee out/r17data/merge_log.txt | tail -70
          cp r17_in/r17-book/* out/r17data/
          cp r17_in/r17-fx/pairfeat_*.parquet out/r17data/ 2>/dev/null || true
          ls -la out/r17data | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: r17data
          path: out/r17data
          retention-days: 30
      - name: Publish the coverage report
        run: |
          mkdir -p /tmp/pub && cp out/r17data/coverage17.* out/r17data/merge_log.txt out/r17data/book_meta.json /tmp/pub/ || true
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          git checkout --orphan r17d-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p r17data && cp /tmp/pub/* r17data/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > r17data/RUN.txt
          git add -f r17data
          git commit -qm "round 17 data coverage (run ${{ github.run_id }})"
          git push -f origin HEAD:round17-data
