name: probe-dukascopy2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/probe_dukascopy2.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -u ci/probe_dukascopy2.py
