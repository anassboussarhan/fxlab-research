name: dbeq-cost
# Prices US-equity requests on Databento (metadata only, no download, no charge). Trigger: ci/DBEQ_COST.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/DBEQ_COST"]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q databento==0.90.0
      - env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python ci/databento_eq_cost.py out
