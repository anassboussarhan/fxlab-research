name: ml-triple-barrier
# scripts/ml_triple_barrier_lab.py (rules fixed in its docstring): boosted triple-barrier entries on every timeframe
# M1-D1 for 11 FX pairs and gold (mirror 2007-2018, USDJPY to 2025) and M1-H1 for the US500 and NAS100 CFDs
# (Dukascopy 2019-2025 cash hours). Bars from the runs named in ci/ML_TB: "MIRROR_RUNS DUKA_RUN USDJPY_RUN".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/ML_TB"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: [{"symbol": "EURUSD", "tf": "M1"}, {"symbol": "GBPUSD", "tf": "M1"}, {"symbol": "USDJPY", "tf": "M1"}, {"symbol": "AUDUSD", "tf": "M1"}, {"symbol": "USDCAD", "tf": "M1"}, {"symbol": "USDCHF", "tf": "M1"}, {"symbol": "NZDUSD", "tf": "M1"}, {"symbol": "EURJPY", "tf": "M1"}, {"symbol": "EURGBP", "tf": "M1"}, {"symbol": "AUDNZD", "tf": "M1"}, {"symbol": "GBPCAD", "tf": "M1"}, {"symbol": "XAUUSD", "tf": "M1"}, {"symbol": "EURUSD", "tf": "M5"}, {"symbol": "GBPUSD", "tf": "M5"}, {"symbol": "USDJPY", "tf": "M5"}, {"symbol": "AUDUSD", "tf": "M5"}, {"symbol": "USDCAD", "tf": "M5"}, {"symbol": "USDCHF", "tf": "M5"}, {"symbol": "NZDUSD", "tf": "M5"}, {"symbol": "EURJPY", "tf": "M5"}, {"symbol": "EURGBP", "tf": "M5"}, {"symbol": "AUDNZD", "tf": "M5"}, {"symbol": "GBPCAD", "tf": "M5"}, {"symbol": "XAUUSD", "tf": "M5"}, {"symbol": "EURUSD", "tf": "M15"}, {"symbol": "GBPUSD", "tf": "M15"}, {"symbol": "USDJPY", "tf": "M15"}, {"symbol": "AUDUSD", "tf": "M15"}, {"symbol": "USDCAD", "tf": "M15"}, {"symbol": "USDCHF", "tf": "M15"}, {"symbol": "NZDUSD", "tf": "M15"}, {"symbol": "EURJPY", "tf": "M15"}, {"symbol": "EURGBP", "tf": "M15"}, {"symbol": "AUDNZD", "tf": "M15"}, {"symbol": "GBPCAD", "tf": "M15"}, {"symbol": "XAUUSD", "tf": "M15"}, {"symbol": "EURUSD", "tf": "M30"}, {"symbol": "GBPUSD", "tf": "M30"}, {"symbol": "USDJPY", "tf": "M30"}, {"symbol": "AUDUSD", "tf": "M30"}, {"symbol": "USDCAD", "tf": "M30"}, {"symbol": "USDCHF", "tf": "M30"}, {"symbol": "NZDUSD", "tf": "M30"}, {"symbol": "EURJPY", "tf": "M30"}, {"symbol": "EURGBP", "tf": "M30"}, {"symbol": "AUDNZD", "tf": "M30"}, {"symbol": "GBPCAD", "tf": "M30"}, {"symbol": "XAUUSD", "tf": "M30"}, {"symbol": "EURUSD", "tf": "H1"}, {"symbol": "GBPUSD", "tf": "H1"}, {"symbol": "USDJPY", "tf": "H1"}, {"symbol": "AUDUSD", "tf": "H1"}, {"symbol": "USDCAD", "tf": "H1"}, {"symbol": "USDCHF", "tf": "H1"}, {"symbol": "NZDUSD", "tf": "H1"}, {"symbol": "EURJPY", "tf": "H1"}, {"symbol": "EURGBP", "tf": "H1"}, {"symbol": "AUDNZD", "tf": "H1"}, {"symbol": "GBPCAD", "tf": "H1"}, {"symbol": "XAUUSD", "tf": "H1"}, {"symbol": "EURUSD", "tf": "H4"}, {"symbol": "GBPUSD", "tf": "H4"}, {"symbol": "USDJPY", "tf": "H4"}, {"symbol": "AUDUSD", "tf": "H4"}, {"symbol": "USDCAD", "tf": "H4"}, {"symbol": "USDCHF", "tf": "H4"}, {"symbol": "NZDUSD", "tf": "H4"}, {"symbol": "EURJPY", "tf": "H4"}, {"symbol": "EURGBP", "tf": "H4"}, {"symbol": "AUDNZD", "tf": "H4"}, {"symbol": "GBPCAD", "tf": "H4"}, {"symbol": "XAUUSD", "tf": "H4"}, {"symbol": "EURUSD", "tf": "D1"}, {"symbol": "GBPUSD", "tf": "D1"}, {"symbol": "USDJPY", "tf": "D1"}, {"symbol": "AUDUSD", "tf": "D1"}, {"symbol": "USDCAD", "tf": "D1"}, {"symbol": "USDCHF", "tf": "D1"}, {"symbol": "NZDUSD", "tf": "D1"}, {"symbol": "EURJPY", "tf": "D1"}, {"symbol": "EURGBP", "tf": "D1"}, {"symbol": "AUDNZD", "tf": "D1"}, {"symbol": "GBPCAD", "tf": "D1"}, {"symbol": "XAUUSD", "tf": "D1"}, {"symbol": "USA500IDXUSD", "tf": "M1"}, {"symbol": "USATECHIDXUSD", "tf": "M1"}, {"symbol": "USA500IDXUSD", "tf": "M5"}, {"symbol": "USATECHIDXUSD", "tf": "M5"}, {"symbol": "USA500IDXUSD", "tf": "M15"}, {"symbol": "USATECHIDXUSD", "tf": "M15"}, {"symbol": "USA500IDXUSD", "tf": "M30"}, {"symbol": "USATECHIDXUSD", "tf": "M30"}, {"symbol": "USA500IDXUSD", "tf": "H1"}, {"symbol": "USATECHIDXUSD", "tf": "H1"}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt
      - name: Bars of ${{ matrix.symbol }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read MIRRORS DUKA USDJPY REST < ci/ML_TB
          s=${{ matrix.symbol }}
          mkdir -p dl
          case $s in
            USA500IDXUSD|USATECHIDXUSD) gh run download $DUKA -p "dk-$s-*" -D dl/dk ;;
            *) for M in $(echo "$MIRRORS" | tr ',' ' '); do gh run download $M -p "mm-$s-*" -D dl/mm_$M || true; done
               if [ "$s" = "USDJPY" ]; then gh run download $USDJPY -p "m1-USDJPY-*" -D dl/uj; fi ;;
          esac
          python ci/place_m1.py dl data/m1
          rm -rf dl
          ls data/m1/$s
      - run: python scripts/ml_triple_barrier_lab.py --symbol ${{ matrix.symbol }} --tf ${{ matrix.tf }} --out out/tb
      - uses: actions/upload-artifact@v4
        with:
          name: tb-${{ matrix.symbol }}-${{ matrix.tf }}
          path: out/tb
          retention-days: 30
  combine:
    needs: lab
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q pandas numpy scipy pyarrow numba
      - uses: actions/download-artifact@v4
        with:
          pattern: tb-*
          path: tb
          merge-multiple: true
      - run: python scripts/ml_triple_barrier_lab.py --combine tb --out pub 2>&1 | tee combine_log.txt
      - name: Publish to the ml-triple-barrier branch (summaries and per-trade returns, no price data)
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p pub/runs && cp tb/tests_*.csv tb/meta_*.json pub/runs/ 2>/dev/null || true
          cp tb/trades_*.csv.gz pub/runs/ 2>/dev/null || true
          cp combine_log.txt pub/ 2>/dev/null || true
          cp -r pub /tmp/pub
          IN="$(cat ci/ML_TB)"
          git checkout --orphan tb-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p ml_triple_barrier && cp -r /tmp/pub/* ml_triple_barrier/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ); bars from $IN" > ml_triple_barrier/RUN.txt
          git add -f ml_triple_barrier
          git commit -qm "Triple-barrier ML entries, all timeframes (run ${{ github.run_id }})"
          git push -f origin HEAD:ml-triple-barrier
