name: r24lw
# Round 24 R1-R3 (docs/round24_preregistration.md):
# - R1: LW of round 23 with rate-differential financing in every engine, on the FX pairs and metals;
# - R2 / R3: the tied session rules and TTM Squeeze (scripts/r24_tied.py) on every instrument.
# R2 jobs also keep the H1-W1 bars they build (artifact r25bars-SYM) for round 25.
# rates: OECD short rates from DBnomics (ci/r24_rates.py), kept as an artifact. Trigger: ci/R24LW.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R24LW"]
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q pandas requests
      - shell: bash
        run: python ci/r24_rates.py
      - id: m
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pandas as pd
          have = set(pd.read_csv("data/rates/oecd_ir3m.csv").ccy) | {"XAU", "XAG"}
          w1 = sorted({j["symbol"] for j in json.load(open("ci/r23a_wave1.json"))["include"]})
          fx1 = [s for s in w1 if len(s) == 6 and s[:3] in have and s[3:] in have]
          w2 = ["USDSEK", "USDNOK", "EURSEK", "EURNOK", "USDMXN", "USDZAR", "USDTRY", "USDPLN", "EURPLN", "USDHUF",
                "EURHUF", "USDCZK", "USDSGD", "USDCNH"]
          fx2 = [s for s in w2 if s[:3] in have and s[3:] in have]
          other2 = ["USA30IDXUSD", "USSC2000IDXUSD", "AUSIDXAUD", "ESPIDXEUR"]
          G0 = "W1,D2,D1,H12,H8,H4,H2"
          inc = []
          for tf in ("M15", "M30"):                                         # longest first
              inc += [{"symbol": s, "tfs": tf, "tag": f"R1-{s}-{tf.lower()}", "wave": 1, "tied": 0} for s in fx1]
          inc += [{"symbol": s, "tfs": G0, "tag": f"R1-{s}-0", "wave": 1, "tied": 0} for s in fx1]
          inc += [{"symbol": s, "tfs": "H1", "tag": f"R1-{s}-h1", "wave": 1, "tied": 0} for s in fx1]
          inc += [{"symbol": s, "tfs": G0, "tag": f"R1-{s}-0", "wave": 2, "tied": 0} for s in fx2]
          inc += [{"symbol": s, "tfs": "H1", "tag": f"R1-{s}-h1", "wave": 2, "tied": 0} for s in fx2]
          allf = "W1,D2,D1,H12,H8,H4,H2,H1,M30,M15"
          inc += [{"symbol": s, "tfs": allf, "tag": f"R2-{s}", "wave": 1, "tied": 1} for s in w1]
          inc += [{"symbol": s, "tfs": G0 + ",H1", "tag": f"R2-{s}", "wave": 2, "tied": 1} for s in w2 + other2]
          print("m=" + json.dumps({"include": inc}))
          PY
          python -c "import json,os; d=json.loads(open(os.environ['GITHUB_OUTPUT']).read().split('m=',1)[1]); print(len(d['include']), 'jobs')"
          cat data/rates/oecd_ir3m_sources.json | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: r24-rates
          path: data/rates
          retention-days: 90
  lw:
    needs: rates
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.rates.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - uses: actions/download-artifact@v4
        with:
          name: r24-rates
          path: data/rates-r24
      - shell: bash
        run: cp data/rates-r24/oecd_ir3m.csv data/rates/ && ls data/rates
      - if: matrix.wave == 1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash ci/r23_place.sh ${{ matrix.symbol }}
      - if: matrix.wave == 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash ci/dl_each.sh $(cat ci/r23_w2_run.txt) "^r23h-${{ matrix.symbol }}$" dl_w2 || { echo "data download incomplete"; exit 1; }
          mkdir -p data/m1/${{ matrix.symbol }}; find dl_w2 -name "*.parquet" -exec mv {} data/m1/${{ matrix.symbol }}/ \;
          python ci/r23_rescale.py ${{ matrix.symbol }} && ls data/m1/${{ matrix.symbol }}
      - if: matrix.tied == 0
        shell: bash
        run: python -W ignore scripts/r23_LW.py --symbol ${{ matrix.symbol }} --tfs ${{ matrix.tfs }} --budget 19500 --financing rates_oecd --out out 2>&1 | grep --line-buffered -v Warning | tail -400
      - if: matrix.tied == 1
        shell: bash
        run: |
          python -W ignore scripts/r23_LW.py --symbol ${{ matrix.symbol }} --tfs ${{ matrix.tfs }} --budget 19500 --financing rates_oecd \
            --tied --placebos 0 --only S.SES.SESSION_MOMENTUM,S.SES.NY_OPEN_REVERSAL,S.FAMOUS.TTM_SQUEEZE --save-bars bars --out out 2>&1 | grep --line-buffered -v Warning | tail -400
      - uses: actions/upload-artifact@v4
        if: matrix.tied == 1
        with:
          name: r25bars-${{ matrix.symbol }}
          path: bars
          retention-days: 60
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r24LW-${{ matrix.tag }}
          path: out
          retention-days: 60
