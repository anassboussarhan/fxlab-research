name: r24z
# Round 24 combine (scripts/r24_combine.py): artifacts (r24LW-*, r24X-*) of the runs listed in ci/R24Z ("RUNID note"
# lines), the X10 rule from round 23 (branch round23, x10.json), BH over all round-24 real streams; statistics to
# branch round24. Trigger: ci/R24Z.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R24Z"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p inp res
          for R in $(grep -E '^[0-9]{8,} ' ci/R24Z | cut -d' ' -f1); do
            bash ci/dl_each.sh $R '^r24(LW|X)-' inp/$R || { echo "artifact download incomplete for run $R"; exit 1; }
          done
          du -sh inp
          git fetch -q origin round23 && git show origin/round23:round23/x10.json > res/x10.json
      - shell: bash
        run: |
          python -W ignore scripts/r24_combine.py --inp inp --out res --x10 res/x10.json 2>&1 | tee res/log.txt
          for f in $(find inp -name "R24_meta_*.json" -o -name "LW_meta_*.json"); do cp "$f" "res/$(basename $(dirname "$f"))_$(basename "$f")" 2>/dev/null || true; done
      - name: Publish
        run: |
          cp -r res /tmp/pub
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          git checkout --orphan r24z-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p round24 && cp -r /tmp/pub/* round24/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > round24/RUN.txt
          git add -f round24
          git commit -qm "round 24 combine (run ${{ github.run_id }})"
          git push -f origin HEAD:round24
