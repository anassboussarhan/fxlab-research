name: ml-confidence
# scripts/ml_confidence_lab.py: E20 / E22 of docs/edges_batch_preregistration.md (confidence curve of the
# fixed-barrier ML entries, M15-H4, 11 FX pairs and gold, 2007-2025). ci/ML_CONF: PANEL_DATA_RUN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/ML_CONF"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "m=$(cat ci/ml_conf_matrix.json)" >> "$GITHUB_OUTPUT"
  lab:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.list.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt statsmodels
      - name: Bars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read PD REST < ci/ML_CONF
          ci/fetch_m1.sh $PD ${{ matrix.symbol }}
      - run: python -W ignore scripts/ml_confidence_lab.py --symbol ${{ matrix.symbol }} --tf ${{ matrix.tf }} --out out/mc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-${{ matrix.symbol }}-${{ matrix.tf }}
          path: out/mc
          retention-days: 30
  combine:
    needs: lab
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt statsmodels
      - uses: actions/download-artifact@v4
        with:
          pattern: mc-*
          path: mc
          merge-multiple: true
      - name: Earlier runs' artifacts (ci/ML_CONF fields after the first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read PD PREV REST < ci/ML_CONF
          for R in $(echo "$PREV" | tr ',' ' '); do gh run download $R -p "mc-*" -D mc_prev/$R || true; done
          mkdir -p mc && find mc_prev -type f -exec cp -n {} mc/ \; || true
      - run: python -W ignore scripts/ml_confidence_lab.py --combine mc --out pub 2>&1 | tee combine_log.txt
      - name: Publish to the ml-confidence branch (summaries and per-trade returns, no price data)
        if: always()
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p pub/runs && cp mc/tests_*.csv mc/trades_*.csv.gz pub/runs/ 2>/dev/null || true
          cp combine_log.txt pub/ 2>/dev/null || true
          cp -r pub /tmp/pub
          git checkout --orphan mc-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p ml_confidence && cp -r /tmp/pub/* ml_confidence/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > ml_confidence/RUN.txt
          git add -f ml_confidence
          git commit -qm "ML confidence curve (run ${{ github.run_id }})"
          git push -f origin HEAD:ml-confidence
