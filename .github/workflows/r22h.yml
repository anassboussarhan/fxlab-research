name: r22h
# Round 22: the pre-registered 2026 check of the streams that counted (I-FVG NAS100 and pooled; K cash-and-carry
# BTC / ETH). Configurations selected on data up to 2025. Results on branch round22h. Trigger: ci/R22H.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R22H"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  candles:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, AUDUSD, NZDUSD, USDCAD, USDCHF, XAUUSD, XAGUSD, USA500IDXUSD, USATECHIDXUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q polars numpy pandas pyarrow
      - run: |
          python -m fxlab.data.acquire_dukascopy_candles --pairs ${{ matrix.symbol }} --start 2026-01-01 --end 2026-11-01 --workers 6 --deadline-min 100
          mkdir -p c26 && find data -name "${{ matrix.symbol }}_2026*.parquet" -exec cp {} c26/ \;
          ls -la c26
      - uses: actions/upload-artifact@v4
        with:
          name: c26-${{ matrix.symbol }}
          path: c26
          retention-days: 30
  fvg:
    needs: candles
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: c26-*
          path: extra
      - env:
          GH_TOKEN: ${{ github.token }}
        run: for S in EURUSD GBPUSD USDJPY AUDUSD NZDUSD USDCAD USDCHF XAUUSD XAGUSD USA500IDXUSD USATECHIDXUSD; do bash ci/r22_place.sh $S > /dev/null 2>&1; done; ls extra
      - run: python -W ignore scripts/r22_h26.py fvg --symbols EURUSD,GBPUSD,USDJPY,AUDUSD,NZDUSD,USDCAD,USDCHF,XAUUSD,XAGUSD,USA500IDXUSD,USATECHIDXUSD --extra extra --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h26-fvg
          path: out
          retention-days: 30
  cc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt requests
      - run: python -W ignore scripts/r22_h26.py cc --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h26-cc
          path: out
          retention-days: 30
  publish:
    needs: [fvg, cc]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h26-*
          path: res
      - run: |
          git init -q pub && cd pub
          mkdir -p round22h && find ../res -name "*.json" -exec cp {} round22h/ \;
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > round22h/RUN.txt
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          git checkout -q -b r22h
          git add -f round22h
          git commit -qm "round 22 2026 check (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:round22h
