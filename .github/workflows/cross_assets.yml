name: cross-assets
# Runs once the bond / index / Brent panel downloads are complete: FS3 (scripts/fs_lab.py --mode fs3) and M3
# (scripts/ml_pooled_lab.py --cross / --m3) for USD/JPY, EUR/USD and gold. ci/CROSS_ASSETS: PANEL_DATA_RUN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/CROSS_ASSETS"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        sym: [USDJPY, EURUSD, XAUUSD]
        tf: [H1, H4, D1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - name: Data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read PD REST < ci/CROSS_ASSETS
          for R in 41507595752 41553423279; do gh run download $R -n edges-data -D raw/$R || true; done
          ci/fetch_m1.sh $PD ${{ matrix.sym }}
          NO_STAGE=1 ci/fetch_m1.sh $PD USTBONDTRUSD BUNDTREUR USA500IDXUSD USATECHIDXUSD JPNIDXJPY BRENTCMDUSD
      - name: FS3
        run: python -W ignore scripts/fs_lab.py --mode fs3 --sym ${{ matrix.sym }} --tf ${{ matrix.tf }} --raw raw --out out/x || echo "fs3 failed"
      - name: M3
        if: matrix.tf == 'H1'
        run: |
          python -W ignore scripts/ml_pooled_lab.py --bars ${{ matrix.sym }} --tf H1 --cross --out out/t
          python -W ignore scripts/ml_pooled_lab.py --m3 ${{ matrix.sym }} --tf H1 --tables out/t --out out/x
          rm -rf out/t
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xa-${{ matrix.sym }}-${{ matrix.tf }}
          path: out/x
  publish:
    needs: lab
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: xa-*
          path: xa
          merge-multiple: true
      - run: python -W ignore scripts/fs_lab.py --combine xa --out pub 2>&1 | tee pub_log.txt || true
      - name: Publish to the cross-assets branch (statistics only)
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p pub && cp xa/* pub/ 2>/dev/null || true; cp pub_log.txt pub/ 2>/dev/null || true
          cp -r pub /tmp/pub
          git checkout --orphan xa-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p cross_assets && cp -r /tmp/pub/* cross_assets/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > cross_assets/RUN.txt
          git add -f cross_assets
          git commit -qm "FS3 / M3 (run ${{ github.run_id }})"
          git push -f origin HEAD:cross-assets
