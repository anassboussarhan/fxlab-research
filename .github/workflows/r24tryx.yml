name: r24tryx
# Round 24 addendum 8: where the USD/TRY R1 returns come from (ci/r24_tryx.py). Trigger: ci/R24TRYX.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R24TRYX"]
permissions:
  contents: read
  actions: read
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash ci/dl_each.sh $(cat ci/r23_w2_run.txt) "^r23h-USDTRY$" dl || exit 1
          mkdir -p data/m1/USDTRY; find dl -name "*.parquet" -exec mv {} data/m1/USDTRY/ \;
          python ci/r23_rescale.py USDTRY
          mkdir -p inp res
          bash ci/dl_each.sh 45258441736 '^r24TRS-x1.0-' inp || exit 1
          git fetch -q origin round24 && git show origin/round24:round24/r24_streams.csv.gz > res/r24_streams.csv.gz
          python -W ignore ci/r24_tryx.py
