name: r24probe
# Round 24 access probe (ci/r24_probe.py): HTTP status and size of one request per candidate source, no data read.
# Trigger: ci/R24PROBE.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R24PROBE"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q requests
      - run: python ci/r24_probe.py
