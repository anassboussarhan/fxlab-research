name: lit3
# Third literature round: scripts/lit3_daily_lab.py (composite currency predictor, Hau-Rey, gold variance premium,
# gold autumn / Chinese New Year, VRP equity timing, option momentum) and scripts/lit3_intraday_lab.py (end-of-day
# momentum on index CFDs / gold / FX, investment-trust month start, the ECB fix). ci/LIT3: MIRRORS DUKA USDJPY.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/LIT3"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt yfinance lunardate requests
      - name: Per-stock straddle results of the options-edges run
        run: |
          git fetch -q origin +options-edges:refs/remotes/origin/options-edges
          mkdir -p pos && git archive origin/options-edges | tar -x -C pos --wildcards '*raw/positions_*'
      - run: python scripts/lit3_daily_lab.py --out out/daily --positions pos 2>&1 | tee out_daily.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lit3-daily
          path: out
          retention-days: 30
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt
      - name: Bars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read MIRRORS DUKA USDJPY REST < ci/LIT3
          mkdir -p dl
          for s in EURUSD GBPUSD USDJPY AUDUSD USDCAD USDCHF NZDUSD XAUUSD; do for M in $(echo "$MIRRORS" | tr ',' ' '); do gh run download $M -p "mm-$s-*" -D dl/mm_${M}_$s || true; done; done
          gh run download $USDJPY -p "m1-USDJPY-*" -D dl/uj
          for s in USA500IDXUSD USATECHIDXUSD; do gh run download $DUKA -p "dk-$s-*" -D dl/dk_$s || true; done
          python ci/place_m1.py dl data/m1
          rm -rf dl
          ls data/m1
      - run: python scripts/lit3_intraday_lab.py --out out/intraday 2>&1 | tee out_intraday.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lit3-intraday
          path: out
          retention-days: 30
  publish:
    needs: [daily, intraday]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lit3-*
          path: res
          merge-multiple: true
      - name: Publish to the lit3 branch (results and per-trade returns, no price data)
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          cp -r res /tmp/l3
          git checkout --orphan l3-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p lit3 && cp -r /tmp/l3/* lit3/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > lit3/RUN.txt
          git add -f lit3
          git commit -qm "Literature round 3 (run ${{ github.run_id }})"
          git push -f origin HEAD:lit3
