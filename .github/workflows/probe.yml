name: probe-dukascopy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/PROBE"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python ci/probe_dukascopy.py
