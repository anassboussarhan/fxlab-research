name: sweep17
# Round 17 libraries (docs/round17_preregistration.md, section 1): per instrument, the round-15 sweep with daily P&L
# (scripts/sweep15.py --daily; D1 / W1 / MN, round-13 engine) and the intraday library with intraday state features
# (scripts/intraday17.py; H4 / H1 / M30 / M15, project bar engine). Data stays in artifacts. Trigger: ci/SWEEP17.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/SWEEP17"]
permissions:
  contents: write
  actions: read
env:
  PYTHONUNBUFFERED: "1"
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "m=$(cat ci/sweep17_syms.json)" >> "$GITHUB_OUTPUT"
  sym:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: ${{ fromJSON(needs.list.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - name: Data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/fetch_m1.sh 41447353092 ${{ matrix.symbol }}
      - name: Daily-engine library (D1 / W1 / MN) with daily P&L
        run: python -W ignore scripts/sweep15.py --symbol ${{ matrix.symbol }} --out out/s17 --daily 2>&1 | grep -v "^  " | tail -20
      - name: Intraday library (H4 / H1 / M30 / M15)
        run: timeout 17700 python -W ignore scripts/intraday17.py --symbol ${{ matrix.symbol }} --out out/s17 --budget 16500 2>&1 | grep -v "converging" | tail -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s17-${{ matrix.symbol }}
          path: out/s17
          retention-days: 30
