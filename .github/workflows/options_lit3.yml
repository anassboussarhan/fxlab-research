name: options-lit3
# Options edges round 3 (scripts/options_edges_lab.py, H1-H12): a fresh export of the DoltHub chains (the earlier
# artifact expired) with the currency and metal ETFs added where the database has them, then the symbol stage and
# the combine stage. New tests: H9 pre-earnings implied-volatility run-up; H11 FX ETFs and H12 gold / silver ETFs
# delta-hedged short straddles. Quotes cut at 2025-12-31. Results to branch options-edges3.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/OPTIONS_LIT3"]
permissions:
  contents: write
  actions: read
env:
  SYMBOLS: SPY,DIA,QQQ,IWM,GLD,SLV,TLT,EEM,XLE,XLF,AAPL,ABBV,ABT,ACN,ADBE,AIG,AMD,AMGN,AMT,AMZN,AVGO,AXP,BA,BAC,BK,BKNG,BLK,BMY,BRK.B,C,CAT,CHTR,CL,CMCSA,COF,COP,COST,CRM,CSCO,CVS,CVX,DE,DHR,DIS,DUK,EMR,F,FDX,GD,GE,GILD,GM,GOOG,GOOGL,GS,HD,HON,IBM,INTC,INTU,ISRG,JNJ,JPM,KHC,KO,LIN,LLY,LMT,LOW,MA,MCD,MDLZ,MDT,MET,META,MMM,MO,MRK,MS,MSFT,NEE,NFLX,NKE,NOW,NVDA,ORCL,PEP,PFE,PG,PLTR,PM,PYPL,QCOM,RTX,SBUX,SCHW,SO,SPG,T,TGT,TMO,TMUS,TSLA,TXN,UBER,UNH,UNP,UPS,USB,V,VZ,WFC,WMT,XOM,FXE,FXY,FXB,FXA,FXC,FXF,UUP,IAU
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas scipy pyarrow yfinance
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Install dolt and clone the options and earnings databases
        run: |
          curl -sSL https://github.com/dolthub/dolt/releases/latest/download/install.sh -o /tmp/install.sh
          sudo bash /tmp/install.sh
          dolt config --global --add user.email ci@example.com
          dolt config --global --add user.name ci
          mkdir -p /tmp/d && cd /tmp/d
          time dolt clone post-no-preference/options > /tmp/clone.log 2>&1; tail -1 /tmp/clone.log
          time dolt clone post-no-preference/earnings > /tmp/clone_e.log 2>&1 || true; tail -1 /tmp/clone_e.log
          du -sh /tmp/d/*
      - name: Export the chains, one query per symbol, 4 copies of the database in parallel (dates <= 2025-12-31)
        run: |
          mkdir -p chains /tmp/raw
          cd /tmp/d/options && dolt sql -q "DESCRIBE option_chain" -r csv > $GITHUB_WORKSPACE/chains/schema.csv
          for i in 1 2 3; do cp -r /tmp/d/options /tmp/d/options_$i; done
          mv /tmp/d/options /tmp/d/options_0
          df -h /
          echo $SYMBOLS | tr ',' '\n' > /tmp/syms.txt
          for i in 0 1 2 3; do
            ( cd /tmp/d/options_$i
              awk -v i=$i 'NR % 4 == i' /tmp/syms.txt | while read s; do
                dolt sql -q "SELECT * FROM option_chain WHERE act_symbol='$s' AND date <= '2025-12-31'" -r csv > /tmp/raw/raw_$s.csv 2> /tmp/raw/err_$s.txt
                echo "$s $(wc -l < /tmp/raw/raw_$s.csv) $(date -u +%T)"
              done ) &
          done
          wait
          du -sh /tmp/raw
      - name: Export earnings dates
        continue-on-error: true
        run: |
          cd /tmp/d/earnings
          dolt sql -q "SHOW TABLES" -r csv | tee $GITHUB_WORKSPACE/chains/earnings_tables.csv
          dolt sql -q "SELECT act_symbol, date FROM earnings_calendar WHERE date <= '2026-03-31'" -r csv > $GITHUB_WORKSPACE/chains/earnings.csv
          wc -l $GITHUB_WORKSPACE/chains/earnings.csv
      - name: Normalise chains and fetch closes
        run: |
          find /tmp/raw -name 'raw_*.csv' -size -200c -delete
          python scripts/options_chain_fetch.py --raw /tmp/raw --out chains | cut -c1-200 | tail -5
          python scripts/options_closes_fetch.py --symbols $SYMBOLS --out chains/closes.csv > /tmp/closes.log 2>&1; tail -3 /tmp/closes.log
          ls chains | head; du -sh chains
      - uses: actions/upload-artifact@v4
        with:
          name: chains
          path: chains
          retention-days: 10
  symbols:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas scipy pyarrow pytest
      - run: python -m pytest -q tests/test_options_edges_lab.py tests/test_options_strategy_lab.py
      - uses: actions/download-artifact@v4
        with:
          name: chains
          path: chains
      - name: Symbols group ${{ matrix.group }} of 8
        run: |
          mkdir -p out
          python scripts/options_edges_lab.py --stage symbols --chain chains --closes chains/closes.csv --group ${{ matrix.group }}/8 --out out 2>&1 | grep -v Warning | tee out/log_symbols_${{ matrix.group }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: edges-${{ matrix.group }}
          path: out
          retention-days: 5
  combine:
    needs: [data, symbols]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas scipy pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: edges-*
          path: parts
      - uses: actions/download-artifact@v4
        with:
          name: chains
          path: chains
      - name: Combine the eight tests
        run: |
          mkdir -p out
          python scripts/options_edges_lab.py --stage combine --inputs $(ls -d parts/* | paste -sd, -) --closes chains/closes.csv --out out 2>&1 | tee out/log_combine.txt
          cp parts/*/meta_*.json parts/*/log_symbols_*.txt out/ 2>/dev/null || true
          mkdir -p out/raw && cp parts/*/positions_*.csv.gz parts/*/signals_*.csv.gz out/raw/ 2>/dev/null || true
          du -sh out
      - name: Publish to the options-edges3 branch
        if: always()
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p /tmp/pub && cp -r out /tmp/pub/options_edges3
          git checkout --orphan oe3-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          cp -r /tmp/pub/options_edges3 .
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > options_edges3/RUN.txt
          git add -f options_edges3
          git commit -qm "Options edges round 3 (run ${{ github.run_id }})"
          git push -f origin HEAD:options-edges3
