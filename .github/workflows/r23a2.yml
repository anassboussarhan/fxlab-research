name: r23a2
# Round 23 part LW relaunch (docs/round23_results.md, deviations): cancel run 44329485816, whose H1/M30/M15 jobs ran
# past the 350-minute job limit and lost their output, then run every unit it did not finish, one job per timeframe
# for group 1, with the checkpointing runner. Trigger: ci/R23A2.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R23A2"]
permissions:
  contents: read
  actions: write
env:
  PYTHONUNBUFFERED: "1"
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=44329485816
          gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/$R/cancel || true
          for k in $(seq 1 50); do
            s=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$R -q .status)
            echo "status $s"; [ "$s" = "completed" ] && exit 0; sleep 30
          done
          gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/$R/force-cancel || true
  list:
    needs: cancel
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "m=$(python ci/r23a2_list.py 44329485816)" >> "$GITHUB_OUTPUT"
  lw:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.list.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/r23_place.sh ${{ matrix.symbol }}
      - run: python -W ignore scripts/r23_LW.py --symbol ${{ matrix.symbol }} --tfs ${{ matrix.tfs }} --budget 19500 --out out 2>&1 | grep -v Warning | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r23LW-${{ matrix.tag }}
          path: out
          retention-days: 60
