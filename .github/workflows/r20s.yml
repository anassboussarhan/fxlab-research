name: r20s
# Round 20 part S (docs/round20_preregistration.md; scripts/r20_swing.py). Results on branch round20s. Trigger: ci/R20S.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R20S"]
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt yfinance requests lxml html5lib
      - run: python -W ignore scripts/r20_swing.py data --out sdata 2>&1 | grep -v "^chunk" | tail -20
      - run: |
          mkdir -p out && cp sdata/data_meta.json out/
          python -W ignore scripts/r20_swing.py run --data sdata --out out 2>&1 | tee out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r20s-data
          path: sdata
          retention-days: 30
      - name: Publish
        if: always()
        run: |
          cp -r out /tmp/pub
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          git checkout --orphan r20s-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p round20s && cp -r /tmp/pub/* round20s/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > round20s/RUN.txt
          git add -f round20s
          git commit -qm "round 20 S (run ${{ github.run_id }})"
          git push -f origin HEAD:round20s
