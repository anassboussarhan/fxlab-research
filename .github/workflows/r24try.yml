name: r24try
# Round 24 addendum 6: buy-and-hold USD/TRY benchmark with carry (ci/r24_try.py). Trigger: ci/R24TRY.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/R24TRY"]
permissions:
  contents: read
  actions: read
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r ci/requirements-ci.txt holidays
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash ci/dl_each.sh $(cat ci/r23_w2_run.txt) "^r23h-USDTRY$" dl || exit 1
          mkdir -p data/m1/USDTRY; find dl -name "*.parquet" -exec mv {} data/m1/USDTRY/ \;
          python ci/r23_rescale.py USDTRY
          bash ci/dl_each.sh 45035758022 "^r24-rates$" rr || exit 1
          cp rr/r24-rates/oecd_ir3m.csv data/rates/
          python -W ignore ci/r24_try.py
