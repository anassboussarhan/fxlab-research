name: cross-market
# The technical-analysis catalog on daily stock-index, ETF, bond, commodity and crypto bars
# (scripts/cross_market_ta_lab.py) and boosted three-outcome ML entries with three targets (scripts/ml_entry_lab.py).
# Rules fixed in the two docstrings. Development data only: ends 2025-12-31.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/CROSS_MARKET"]
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy pyarrow scipy polars yfinance
      - run: python scripts/cross_market_ta_lab.py --stage data --out cmdata
      - name: Coverage as annotations
        run: |
          python - <<'PY'
          import json
          for s, m in json.load(open("cmdata/meta.json")).items():
              print(f"::notice title=data {s}::{m.get('status')} {m.get('first', '')} {m.get('last', '')} bars {m.get('bars', '')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cm-data
          path: cmdata
          retention-days: 30
  ta:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: ["SPY", "QQQ", "IWM", "DIA", "XLK", "XLF", "XLE", "XLV", "XLI", "XLY", "XLP", "XLU", "XLB", "EEM", "EFA", "EWJ", "^GDAXI", "^FCHI", "^STOXX50E", "^N225", "^HSI", "TLT", "IEF", "LQD", "HYG", "GLD", "SLV", "USO", "UNG", "DBA", "DBC", "BTC-USD", "ETH-USD"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r ci/requirements-ci.txt
      - run: python -m pytest -q tests/test_daily_strategies.py
      - uses: actions/download-artifact@v4
        with:
          name: cm-data
          path: cmdata
      - run: python scripts/cross_market_ta_lab.py --stage run --data cmdata --symbols "${{ matrix.symbol }}" --out out/ta
      - uses: actions/upload-artifact@v4
        with:
          name: cm-ta-${{ strategy.job-index }}
          path: out/ta
          retention-days: 30
  ml:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r ci/requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          name: cm-data
          path: cmdata
      - run: python scripts/ml_entry_lab.py --data cmdata --out out/ml 2>&1 | tee ml_log.txt
      - run: cp ml_log.txt out/ml/log.txt
      - name: Results as annotations
        run: |
          python - <<'PY'
          import pandas as pd
          for _, r in pd.read_csv("out/ml/tests.csv").iterrows():
              print(f"::notice title=ML {r.test} {r.variant}::trades {r.trades} mean {r.mean_bp:.2f}bp t {r.t:.2f} hit {r.hit:.3f} random-entry p {r.get('random_entry_p', float('nan'))}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cm-ml
          path: out/ml
          retention-days: 30
  combine:
    needs: [ta, ml]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy pyarrow scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: cm-ta-*
          path: ta
      - uses: actions/download-artifact@v4
        with:
          name: cm-ml
          path: ml
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: cm-data
          path: cmdata
      - run: python scripts/cross_market_ta_lab.py --stage combine --runs ta --out pub/ta | tee pub_log.txt
      - name: Publish to the cross-market branch (summaries and out-of-sample return series, no price data)
        run: |
          git config user.name "fxlab-sweep"
          git config user.email "fxlab-sweep@users.noreply.github.com"
          mkdir -p pub/ml pub/ta/per_symbol
          cp pub_log.txt pub/ta/log.txt
          cp cmdata/meta.json pub/data_meta.json
          cp -r ml/* pub/ml/ 2>/dev/null || true
          find ta -name 'rows_*.csv' -exec cp {} pub/ta/per_symbol/ \;
          find ta -name 'oos_*.parquet' -exec cp {} pub/ta/per_symbol/ \;
          cp -r pub /tmp/pub
          git checkout --orphan cm-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore || true
          mkdir -p cross_market && cp -r /tmp/pub/* cross_market/
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > cross_market/RUN.txt
          git add -f cross_market
          git commit -qm "Cross-market TA catalog and ML entries (run ${{ github.run_id }})"
          git push -f origin HEAD:cross-market
